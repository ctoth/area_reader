[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "area-reader"
version = "0.1.0"
description = "A Python library to parse MUD area files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher Toth" }]
dependencies = [
    "attrs",
    "cattrs",
]

[project.urls]
Homepage = "https://github.com/ctoth/area_reader"
Repository = "https://github.com/ctoth/area_reader"

[project.scripts]
area-reader = "area_reader:main"

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis",
    "pytest-cov",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "--cov=area_reader --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["area_reader"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["area_reader"]

[tool.hatch.build.targets.sdist]
include = ["area_reader", "README.md", "test", "conftest.py"]

[dependency-groups]
refactor = [
    "import-linter>=2.13",
    "rope>=1.14,<2",
    "ruff>=0.16.3",
    "vulture>=2.16",
]
