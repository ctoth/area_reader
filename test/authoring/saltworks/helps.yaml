  - level: 0
    keywords: SALTWORKS 'SALT WORKS'
    text: |
      The Salt Works stand on the flats south of the old road, a short walk
      from Midgaard.  Brine is drawn from a well, left in open pans for the
      sun and wind, then boiled down over wood fires and dried in the loft.

      Buyers deal with the tallyman in the office by the gate.  The store is
      kept locked and the foreman carries the key.  The sluice at the bottom
      of the pans goes one way only.
